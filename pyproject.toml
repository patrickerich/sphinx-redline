[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-redline"
version = "0.1.1"
description = "Sphinx extension for inline review comments anchored to the RST/Markdown source"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Sphinx 9.1 itself requires Python 3.12. The lower bounds follow the versions
# that are actually tested; relax them once CI covers older releases.
requires-python = ">=3.12"
dependencies = [
    "Sphinx>=9.1",
]
keywords = ["sphinx", "documentation", "review", "comments", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
]

[project.urls]
Documentation = "https://patrickerich.github.io/sphinx-redline/"
Source = "https://github.com/patrickerich/sphinx-redline"
Issues = "https://github.com/patrickerich/sphinx-redline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinx_redline = ["static/redline/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
