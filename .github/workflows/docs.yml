name: docs

# Merging a PR into main is a push to main, so this deploys on merge. A new
# comment on the redline branch starts this workflow via workflow_dispatch
# (see rebuild-docs.yml on that branch).
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The docs load the extension, so its code is a docs input too.
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'sourceme.sh'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'sourceme.sh'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the build follows each comment from the commit it was
      # made on to today's sources with git diff.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Comments live on the redline branch; a fork may not have one yet.
      - name: Fetch comments
        run: git fetch --no-tags origin redline:refs/remotes/origin/redline || echo "No comments branch"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # sourceme.sh creates .venv, which the Makefile requires; the build runs
      # with -W, so a broken reference or a page missing from every toctree
      # fails here.
      - name: Build documentation
        shell: bash
        env:
          # Encrypted guest token (see docs/source/setup.rst); empty = read-only.
          REDLINE_GUEST_KEY: ${{ vars.REDLINE_GUEST_KEY }}
        run: |
          source ./sourceme.sh
          make docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job needs write access, and only to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys so two quick merges cannot race.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
