name: release

# Publishing a GitHub release for a v* tag builds the package and uploads it
# to PyPI. PyPI trusts this workflow directly (Trusted Publishing), so no API
# token is stored anywhere. The `pypi` environment only accepts v* tags.
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check the version matches the tag
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "pyproject.toml says ${version}, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      # Without these the package installs fine but every page breaks.
      - name: Check the browser files are included
        run: |
          for file in redline.js redline.css keytool.html; do
            unzip -l dist/*.whl | grep -q "sphinx_redline/static/redline/${file}"
            tar tzf dist/*.tar.gz | grep -q "sphinx_redline/static/redline/${file}"
          done

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sphinx-redline
    # Only this job may request the OIDC token PyPI checks.
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
